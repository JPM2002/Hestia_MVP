# render.yaml
services:
  - type: web
    name: hestia-whatsapp-gateway
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app

  - type: worker
    name: hestia-notification-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gateway_app.workers.notification_worker
